model:
  name: conv1d_autoencoder
  paradigm: reconstruction

data:
  channel: t2b1
  window_size: 2048
  hop: 2048
  val_fraction: 0.2
  in_channels: 1
  batch_size: 256
  num_workers: 0       # > 0 materialises the window view once per worker
  seed: 42

training:
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0
  patience: 5 # early stopping; 0 disables it
  device: cuda # auto | cpu | cuda
  seed: 42 # null disables seeding
  checkpoint_name: ims_t2b1_conv1dae.pt

evaluation:
  aggregation: mean # mean | max over a snapshot's windows
  quantile: 0.99 # threshold percentile on healthy validation scores
  output_artifacts: ims_t2b1_conv1dae